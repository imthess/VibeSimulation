[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesimulation"
version = "1.2.0"
description = "Turn a photo of a digital circuit into an editable Logisim circuit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pillow"]

[project.gui-scripts]
vibesimulation = "vibesimulation.app:main"

[tool.setuptools.packages.find]
where = ["src"]
