[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesimulation"
version = "1.3.0"
description = "Free circuit simulator: Logisim-style digital logic, Multisim-style analog, Verilog and SystemVerilog"
readme = "README.md"
license = { text = "GPL-3.0-only" }
keywords = ["logisim", "multisim", "spice", "verilog", "systemverilog", "circuit simulator", "tkinter"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)", "License :: OSI Approved :: GNU General Public License v3 (GPLv3)", "Environment :: X11 Applications"]
requires-python = ">=3.9"
dependencies = ["pillow"]

[project.urls]
Homepage = "https://github.com/imthess/VibeSimulation"

[project.gui-scripts]
vibesimulation = "vibesimulation.app:main"

[tool.setuptools.packages.find]
where = ["src"]
