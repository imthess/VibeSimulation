name: build-apps
# Builds the Windows, macOS and Linux apps. Runs when you push a tag like v1.4.0, or by hand (Actions > build-apps > Run workflow).
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions:
  contents: write      # lets the last step attach the files to the Release
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: VibeSimulation-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
      - name: Attach to the GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
