name: tests
on: [push, pull_request]
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y iverilog python3-tk
      - run: pip install -e .
      - name: Fast tests (no window)
        run: python dev/run_all.py --fast
